; -------------------------------------------
; |    |      |  PolyBar           |    |   |
; -------------------------------------------
;
; -------------------------------------------
; Polybar Configuration - Tarun Bhandari
; -------------------------------------------


; Colors
; -------------------------------------------

; Using pywal16 to generate the colorscheme from the wallpapers
; https://github.com/eylles/pywal16/wiki/Customization#polybar
[colors]
transparent = #00FFFFFF
red = #EA638C

include-file = "~/.cache/wal/colors-polybar"

; -------------------------------------------
; Bar and module configuration

; Bar
; -------------------------------------------
[bar/mybar]
override-redirect = false
enable-ipc = true

fixed-center = true
bottom = true

offset-x = 0
offset-y = 5pt

width = 100%
height = 25pt
radius = 1,15,20,20

background = ${colors.transparent}
foreground = ${colors.foreground}

font-0 = JetBrainsMono Nerd Font:size=8;2

modules-left = ewmh date tray
; modules-center = 
modules-right = pulseaudio wireless wired

; -------------------------------------------
; Modules

; Date
; -------------------------------------------
[module/date]
type = internal/date
interval = 1.0

format = <label>
label = " %date% | %time% "
label-foreground = ${colors.foreground}
label-background = ${colors.background}

; Date and Time formats
; https://en.cppreference.com/w/cpp/io/manip/put_time
date = "%d %b, %Y"
time = "%H: %M"

; Network
; -------------------------------------------
[module/wireless]
type = internal/network
interface = wlp0s20f0u6
interface-type = wireless
interval = 3.0

label-connected = " 󰤨  Connected "
label-connected-background = ${colors.background}
label-connected-foreground = ${colors.foreground}
label-connected-padding = 8pt

[module/wired]
; -------------------------------------------
type = internal/network
interface = enp0s20f0u14 
interface-type = wired
interval = 3.0
unknown-as-up = true

label-connected = " 󰛳  Connected "
label-connected-background = ${colors.background}
label-connected-foreground = ${colors.foreground}
label-connected-padding = 8pt

; Workspace
; -------------------------------------------
[module/ewmh]
type = internal/xworkspaces
pin-workspace = true
enable-click = false
label = " <label-state> "

label-active = %index%
label-active-foreground = ${colors.background}
label-active-background = ${colors.primary}
label-active-padding = 8pt

label-occupied = %index%
label-occupied-foreground = ${colors.background}
label-occupied-background =${colors.red} 
label-occupied-padding = 8pt

label-empty = "" 

label-urgent = %index%
label-urgent-foreground = ${colors.background}
label-urgent-background = ${colors.red}
label-urgent-padding = 8pt

; Volume
; -------------------------------------------
[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
interval = 5

format-volume = "<ramp-volume><label-volume>"
ramp-volume-0 = " "
ramp-volume-1 = " "
ramp-volume-2 = " "
ramp-volume-background = ${colors.secondary}
ramp-volume-foreground = ${colors.foreground}
ramp-volume-padding = 8pt
label-volume-background = ${colors.background}
label-volume-foreground = ${colors.foreground}
label-volume-padding = 8pt

label-muted = "   Mute "
label-muted-foreground = ${colors.background}
label-muted-background = ${colors.red}
label-muted-padding = 8pt

click-right = pavucontrol

; Tray
; -------------------------------------------
[module/tray]
type = internal/tray
format = "| <tray>"
format-background = ${colors.background}
format-padding = 8pt
tray-background = ${colors.background}



